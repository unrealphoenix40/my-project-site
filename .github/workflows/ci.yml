name: Проверка проекта
on:
  push:
    branches: [ main ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - name: Получить код
      uses: actions/checkout@v4
    - name: Проверить наличие файлов
      run: |
        echo "Проверяем файлы проекта..."
        ls -la
        echo "Файл index.html:"
        test -f index.html && echo "Найден!" || echo "НЕ НАЙДЕН!"
        - name: Проверить README
          run: |
            test -f README.md && echo "README найден!" || echo "README НЕ НАЙДЕН!"
